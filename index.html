<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都道府県シルエット＆ちしきクイズ！ | 小学生向け</title>
    <meta name="description" content="日本の都道府県の形（シルエット）や、特産品・名所・日本一の記録（全500問以上）を楽しく学べる小学生向けクイズゲーム！">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts: Klee One / Yomogi (黒板にチョークで書いたような手書き風フォント) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decorations">
        <div class="floating-shape shape-1">🗾</div>
        <div class="floating-shape shape-2">⭐</div>
        <div class="floating-shape shape-3">🌸</div>
        <div class="floating-shape shape-4">富士山</div>
        <div class="floating-shape shape-5">🎒</div>
        <div class="floating-shape shape-6">✨</div>
    </div>

    <main class="app-container">
        <!-- 音声ON/OFF切り替えボタン -->
        <header class="app-header">
            <button id="sound-toggle" class="icon-btn" aria-label="効果音切り替え">
                <span id="sound-icon">🔊</span> 効果音: <span id="sound-state">ON</span>
            </button>
        </header>

        <!-- 1. スタート画面 -->
        <section id="start-screen" class="card screen active">
            <div class="title-badge">日本ちずマスター</div>
            <h1 class="main-title">
                <span class="title-sub">形（かたち）と ちしきで学べる！</span>
                <span class="title-row">
                    <span>都道府県クイズ！</span>
                    <!-- スズメのキャラクター (social-studies-quiz の src/ui/sparrow.ts と同じ絵) -->
                    <span class="sparrow"><svg viewBox="0 0 120 112" role="img" aria-label="スズメのキャラクター"><path fill="none" stroke="#e8963a" stroke-width="3" stroke-linecap="round" d="M48 103V109M43 109H53M72 103V109M67 109H77"/><g stroke="#1c2a4a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path fill="#8c5a33" d="M22 62C8 72 6 92 17 103C25 97 29 82 27 66ZM98 62C112 72 114 92 103 103C95 97 91 82 93 66Z"/><path fill="#b9763f" d="M54 30C53 22 56 17 59 21C60 15 65 15 65 21C68 18 71 22 68 30Z"/><path fill="#b9763f" d="M60 27C36 27 19 45 19 68C19 91 36 106 60 106C84 106 101 91 101 68C101 45 84 27 60 27Z"/></g><path fill="#fbf3e2" d="M60 58C50 51 34 53 25 64C21 85 37 103 60 103C83 103 99 85 95 64C86 53 70 51 60 58Z"/><path fill="none" stroke="#8c5a33" stroke-width="2" stroke-linecap="round" opacity="0.55" d="M46 39Q60 34 74 39M40 47Q60 40 80 47"/><ellipse cx="30" cy="83" rx="6.5" ry="5" fill="#1c2a4a"/><ellipse cx="90" cy="83" rx="6.5" ry="5" fill="#1c2a4a"/><ellipse cx="42" cy="69" rx="7.5" ry="8.5" fill="#1c2a4a"/><circle cx="44.6" cy="65.4" r="3.1" fill="#fff"/><circle cx="39.4" cy="72.6" r="1.5" fill="#fff"/><ellipse cx="78" cy="69" rx="7.5" ry="8.5" fill="#1c2a4a"/><circle cx="80.6" cy="65.4" r="3.1" fill="#fff"/><circle cx="75.4" cy="72.6" r="1.5" fill="#fff"/><path fill="#1c2a4a" d="M53 91Q60 94 67 91Q67.5 99 60 101Q52.5 99 53 91Z"/><path fill="#5a4636" stroke="#1c2a4a" stroke-width="2" stroke-linejoin="round" d="M54 79.5Q60 75.5 66 79.5L60 88.5Z"/><path fill="none" stroke="#1c2a4a" stroke-width="1.4" stroke-linecap="round" d="M56 81.5Q60 83.5 64 81.5"/></svg></span>
                </span>
            </h1>
            <div class="mascot-box">
                <div class="mascot-img">🗺️</div>
                <p class="mascot-bubble">日本全国47都道府県の「形」や「名物・日本一（全517問）」のクイズに挑戦しよう！</p>
            </div>
            
            <!-- モード選択タブ -->
            <div class="mode-select-section">
                <div class="mode-select-title">🎮 あそぶモードを選んでね！</div>
                <div class="mode-select-container">
                    <button class="mode-btn active" data-mode="silhouette">
                        <span class="mode-icon">🗺️</span>
                        <span class="mode-name">シルエット</span>
                    </button>
                    <button class="mode-btn" data-mode="knowledge">
                        <span class="mode-icon">💡</span>
                        <span class="mode-name">ちしき (500問+)</span>
                    </button>
                    <button class="mode-btn" data-mode="mix">
                        <span class="mode-icon">🌟</span>
                        <span class="mode-name">ミックス</span>
                    </button>
                </div>
            </div>

            <div class="rule-box">
                <div class="rule-item">
                    <span class="rule-icon">❓</span>
                    <span>ぜんぶで <strong>10問</strong> 出題！</span>
                </div>
                <div class="rule-item">
                    <span class="rule-icon">⏱️</span>
                    <span>1問の制限時間は <strong>30秒</strong>！</span>
                </div>
                <div class="rule-item">
                    <span class="rule-icon">🎯</span>
                    <span>4つの選択肢から選ぼう！</span>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary pulse-btn">
                <span>クイズをはじめる！</span> 🚀
            </button>
        </section>

        <!-- 2. クイズ画面 -->
        <section id="quiz-screen" class="card screen">
            <!-- 進行度 ＆ スコア表示 -->
            <div class="quiz-info-bar">
                <div class="progress-badge">
                    もんだい <span id="current-question-num">1</span> / <span id="total-questions-num">10</span>
                </div>
                <div id="mode-badge" class="mode-type-badge">
                    🗺️ シルエット
                </div>
                <div class="score-badge">
                    てんすう: <span id="current-score">0</span> 点
                </div>
            </div>

            <!-- タイマーバー -->
            <div class="timer-container">
                <div class="timer-label">
                    <span>⏱️ のこり時間</span>
                    <span id="timer-text">30秒</span>
                </div>
                <div class="timer-bar-outer">
                    <div id="timer-bar-inner" class="timer-bar-inner"></div>
                </div>
            </div>

            <!-- 問題表示エリア（動的表示） -->
            <div class="question-box" id="question-box">
                <!-- Silhouette SVG or Knowledge Card rendered dynamically -->
            </div>

            <!-- 4択選択肢 -->
            <div class="options-grid" id="options-container">
                <button class="btn option-btn" data-index="0">選択肢 1</button>
                <button class="btn option-btn" data-index="1">選択肢 2</button>
                <button class="btn option-btn" data-index="2">選択肢 3</button>
                <button class="btn option-btn" data-index="3">選択肢 4</button>
            </div>
        </section>

        <!-- 3. 結果画面 -->
        <section id="result-screen" class="card screen">
            <div class="result-header">
                <div id="result-emoji" class="result-emoji">🎉</div>
                <h2 id="result-title" class="result-title">けっかはっぴょう！</h2>
            </div>

            <div class="score-card">
                <div class="score-main">
                    <span id="final-score" class="score-num">0</span>
                    <span class="score-unit">/ 100 点</span>
                </div>
                <div id="rank-badge" class="rank-badge">都道府県マスター</div>
                <p id="result-message" class="result-message">素晴らしい！完璧な知識です！</p>
            </div>

            <!-- ふりかえりリスト -->
            <div class="review-container">
                <h3 class="review-title">🔍 ふりかえり（出題された問題）</h3>
                <div id="review-list" class="review-list">
                    <!-- Review items dynamically generated -->
                </div>
            </div>

            <div class="result-actions">
                <button id="restart-btn" class="btn btn-primary">
                    タイトルへもどる 🏠
                </button>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>© 2026 c1t0d0s0</p>
    </footer>

    <!-- Canvas for Confetti animation -->
    <canvas id="confetti-canvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
